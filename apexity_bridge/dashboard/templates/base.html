<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ session.get('csrf_token', '') }}">
  <title>{% block title %}ApexityEdu Bridge{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body data-page="{% block page %}{% endblock %}">
<header class="topbar">
  <div class="brand">ApexityEdu <span>Smart Attendance Bridge</span></div>
  <nav>
    <a href="{{ url_for('overview') }}" class="{{ 'active' if request.endpoint == 'overview' }}">Overview</a>
    <a href="{{ url_for('devices_page') }}" class="{{ 'active' if request.endpoint == 'devices_page' }}">Devices</a>
    <a href="{{ url_for('students_page') }}" class="{{ 'active' if request.endpoint == 'students_page' }}">Students</a>
    <a href="{{ url_for('attendance_page') }}" class="{{ 'active' if request.endpoint == 'attendance_page' }}">Attendance</a>
    <a href="{{ url_for('logs_page') }}" class="{{ 'active' if request.endpoint == 'logs_page' }}">Logs</a>
    <a href="{{ url_for('settings_page') }}" class="{{ 'active' if request.endpoint == 'settings_page' }}">Settings</a>
  </nav>
  <div class="user">
    <span id="ems-pill" class="pill unknown">EMS …</span>
    <a href="{{ url_for('logout') }}" class="logout">Log out</a>
  </div>
</header>
<main class="content">
  <div id="flash" class="flash hidden"></div>
  {% block content %}{% endblock %}
</main>
<footer class="footer">ApexityEdu Attendance Bridge · local only · attendance data stays on this PC until the EMS accepts it</footer>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
