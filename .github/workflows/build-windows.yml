name: Build Windows installer

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: PyInstaller + Inno Setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-packaging.txt

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements-packaging.txt

      - name: Generate ICO / BMP icons
        run: python packaging/make_icons.py

      - name: Freeze ApexityEduBridge.exe
        run: python -m PyInstaller --noconfirm --clean packaging/ApexityEduBridge.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss

      - name: Zip portable app
        run: |
          Compress-Archive -Path dist\ApexityEduBridge\* -DestinationPath dist\ApexityEduBridge-portable-1.0.0.zip -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ApexityEduBridge-Setup-1.0.0
          path: dist/ApexityEduBridge-Setup-1.0.0.exe
          if-no-files-found: error

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: ApexityEduBridge-portable-1.0.0
          path: dist/ApexityEduBridge-portable-1.0.0.zip
          if-no-files-found: error
