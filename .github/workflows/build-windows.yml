name: Build Windows installer

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: PyInstaller + Inno Setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-packaging.txt

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements-packaging.txt

      - name: Synchronize release version
        shell: pwsh
        run: |
          $version = python -c "from apexity_bridge import __version__; print(__version__)"
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            python -m scripts.release_metadata "${{ github.ref_name }}"
          } else {
            python -m scripts.release_metadata
          }

      - name: Generate ICO / BMP icons
        run: python packaging/make_icons.py

      - name: Freeze ApexityEduBridge.exe
        run: python -m PyInstaller --noconfirm --clean packaging/ApexityEduBridge.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss

      - name: Zip portable app
        run: |
          Compress-Archive -Path dist\ApexityEduBridge\* -DestinationPath dist\ApexityEduBridge-portable-${{ env.APP_VERSION }}.zip -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ApexityEduBridge-Setup-${{ env.APP_VERSION }}
          path: dist/ApexityEduBridge-Setup-${{ env.APP_VERSION }}.exe
          if-no-files-found: error

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: ApexityEduBridge-portable-${{ env.APP_VERSION }}
          path: dist/ApexityEduBridge-portable-${{ env.APP_VERSION }}.zip
          if-no-files-found: error

      - name: Generate update manifest
        run: python -m scripts.release_metadata

      - name: Upload update manifest
        uses: actions/upload-artifact@v4
        with:
          name: update-manifest
          path: dist/update.json
          if-no-files-found: error

  release:
    name: Publish update channel
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ApexityEduBridge-Setup-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: update-manifest
          path: release
      - name: Publish installer and manifest together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ github.ref_name }}" release/* --verify-tag --generate-notes --latest
